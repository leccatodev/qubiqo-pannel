<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>QubiqoHost — Manutenzione</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf7ff;background:#061825}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#061825}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px;position:relative}
body:before,body:after{content:"";position:absolute;border-radius:50%;filter:blur(12px);pointer-events:none}
body:before{width:360px;height:360px;background:rgba(0,190,220,.13);top:-170px;left:-150px}
body:after{width:420px;height:420px;background:rgba(36,88,190,.14);right:-210px;bottom:-210px}
.grid{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(rgba(120,190,220,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(120,190,220,.12) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent)}
.card{width:min(680px,100%);position:relative;border:1px solid rgba(95,209,236,.28);background:linear-gradient(145deg,rgba(11,39,56,.96),rgba(5,24,37,.96));border-radius:30px;padding:46px 34px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.34),0 0 50px rgba(0,190,220,.08)}
.logo{width:76px;height:76px;margin:0 auto 24px;border-radius:23px;display:grid;place-items:center;background:linear-gradient(145deg,#0db4cc,#078aa9);box-shadow:0 12px 30px rgba(0,174,207,.25);font-size:31px;font-weight:800;color:#fff}
.brand{font-size:30px;font-weight:800;letter-spacing:-1px;margin-bottom:28px}.brand span{color:#48c8ec}
.badge{display:inline-flex;align-items:center;gap:9px;padding:9px 15px;border-radius:999px;border:1px solid rgba(75,204,229,.3);background:rgba(25,129,151,.13);color:#7bd9ec;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1.4px}
.dot{width:8px;height:8px;border-radius:50%;background:#43d2b1;box-shadow:0 0 14px rgba(67,210,177,.7)}
h1{font-size:clamp(34px,7vw,56px);line-height:1.02;letter-spacing:-2px;margin:22px 0 16px;color:#f2fbff}p{max-width:520px;margin:0 auto;color:#91a9b8;font-size:17px;line-height:1.65}.small{margin-top:24px;font-size:13px;color:#67818f}
@media(max-width:520px){body{padding:16px}.card{padding:38px 22px;border-radius:24px}.logo{width:68px;height:68px;border-radius:20px}.brand{font-size:27px;margin-bottom:24px}p{font-size:15px}.small{font-size:12px}}
</style>
</head>
<body>
<div class="grid"></div>
<main class="card" aria-labelledby="title">
<div class="logo">QH</div>
<div class="brand">Qubiqo<span>Host</span></div>
<div class="badge"><span class="dot"></span> Manutenzione</div>
<h1 id="title">Il pannello è in manutenzione</h1>
<p>Stiamo effettuando alcuni interventi per migliorare QubiqoHost e rendere il pannello più stabile, veloce e sicuro.</p>
<p class="small">Riprova più tardi. Grazie per la pazienza.</p>
</main>
</body>
</html>
