<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050711">
  <title>QubiqoHost — Accesso Admin</title>
  <link rel="stylesheet" href="/css/style.css?v=20260905-lang-dropdown1">
  <script src="/js/common.js?v=20260826-admin"></script>
</head>
<body class="auth-page">
  <main class="auth-main" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px">
    <section class="auth-card" style="width:min(480px,100%)">
      <div class="auth-heading">
        <span class="auth-step">Area amministratore</span>
        <h2>Accesso Admin</h2>
        <p>Questa pagina accetta esclusivamente credenziali di amministratore.</p>
      </div>
      <form id="adminLoginForm" class="auth-form">
        <label for="adminUsername">Username amministratore</label>
        <div class="auth-input-wrap"><input id="adminUsername" type="text" autocomplete="username" required></div>
        <label for="adminPassword">Password</label>
        <div class="auth-input-wrap"><input id="adminPassword" type="password" autocomplete="current-password" required></div>
        <button type="submit" class="btn auth-submit">Accedi all'Admin</button>
      </form>
      <p id="adminLoginError" class="auth-error hidden"></p>
    </section>
  </main>
  <footer class="site-footer">QubiqoHost - Managed by Variune Studios</footer>
  <script src="/js/admin-login.js?v=20260826"></script>
</body>
</html>
